name: One-time Clanker review verification

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/one-time-clanker-review.yml

permissions:
  contents: read

jobs:
  offline-tests:
    if: ${{ github.event.pull_request.number == 3 && github.event.pull_request.head.repo.full_name == 'dossja88/clanker-live-chat' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head without persisting credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record candidate SHA and tooling
        run: |
          git rev-parse HEAD
          node --version
          git --version
      - name: Regression and safety tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/regression.cjs
          node tests/headless2048.cjs
          node tests/supervisor2048.cjs
          node tests/benchmark2048.cjs
          node tests/protocol2048.cjs
          node tests/agent-scope-check.cjs
          node tests/agent-overlap.cjs
