name: One-time read-only stage observer verification

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/one-time-stage-observer.yml

permissions:
  contents: read

jobs:
  offline-test:
    if: ${{ github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == 'dossja88/clanker-live-chat' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout pinned PR source (no stored credentials)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record full SHA and runtime
        run: |
          git rev-parse HEAD
          node --version
          git --version
      - name: Run all ten offline suites
        shell: bash
        run: |
          set -euo pipefail
          node tests/read-only-stage-observer.cjs
          node tests/stage-replay.cjs
          node tests/regression.cjs
          node tests/headless2048.cjs
          node tests/supervisor2048.cjs
          node tests/benchmark2048.cjs
          node tests/protocol2048.cjs
          node tests/agent-scope-check.cjs
          node tests/agent-overlap.cjs
          node tests/agent-feedback-diff.cjs
