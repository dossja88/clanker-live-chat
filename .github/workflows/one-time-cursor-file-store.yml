name: One-time cursor file-store native verification
on:
  push:
    branches:
      - feat/private-replay-cursor-store-v1
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show tested commit
        run: git rev-parse HEAD && node --version
      - name: Exact new native filesystem, child process and STOP tests
        run: node tests/cursor-file-store.cjs
      - name: All existing offline suites
        run: node scripts/run-offline-tests.cjs
