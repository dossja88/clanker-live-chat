name: One-time Stage Replay reviewer verification

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/one-time-stage-replay-review.yml

permissions:
  contents: read

jobs:
  offline-tests:
    if: ${{ github.event.pull_request.number == 6 && github.event.pull_request.head.repo.full_name == 'dossja88/clanker-live-chat' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact review SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact SHA, Node and Git version
        run: |
          git rev-parse HEAD
          node --version
          git --version
      - name: Run eight offline suites without dependencies or network
        shell: bash
        run: |
          set -euo pipefail
          node tests/stage-replay.cjs
          node tests/regression.cjs
          node tests/headless2048.cjs
          node tests/supervisor2048.cjs
          node tests/benchmark2048.cjs
          node tests/protocol2048.cjs
          node tests/agent-scope-check.cjs
          node tests/agent-overlap.cjs
